
services:

  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
    

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql
    
